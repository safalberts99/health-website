<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - The Growth Path</title>
  <meta name="description" content="Get in touch.">
  <link rel="stylesheet" href="base.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">The Growth Path</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="subjects.html">Subjects</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <div class="nav-controls">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="toggle-icon toggle-sun">&#9728;</span>
        <span class="toggle-icon toggle-moon">&#9789;</span>
      </button>
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
<section class="hero">
  <h1 class="hero-title">Get in <em>Touch</em></h1>
  <p class="hero-subtitle">Want to say hi, share a thought, or ask a question? I would love to hear from you.</p>
</section>
<main class="content-wrap">
  <form class="contact-form" id="contactForm">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit">Send Message</button>
  </form>
  <p id="formResponse" style="text-align:center; margin-top:1.5rem; color:var(--accent);"></p>
</main>
<footer>
  <div class="footer-inner">
    <div><div class="footer-brand">The Growth Path</div><p class="footer-note">Small changes, big steps.</p></div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="subjects.html">Subjects</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
